[package]
name = "steam-vdf"
version = "0.1.0"
edition = "2021"
description = "Lossless Steam VDF codec (binary shortcuts.vdf and text configset/.acf)"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1.0.150"
tempfile = "3.27"
